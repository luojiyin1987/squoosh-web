<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 装饰网格 -->
  <g opacity="0.06">
    <defs>
      <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#fff" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- 装饰圆 -->
  <circle cx="900" cy="180" r="280" fill="none" stroke="#fff" stroke-width="1" opacity="0.08"/>
  <circle cx="950" cy="200" r="200" fill="none" stroke="#fff" stroke-width="1" opacity="0.06"/>

  <!-- Logo 图标 -->
  <g transform="translate(100, 200)" filter="url(#shadow)">
    <rect width="120" height="120" rx="32" fill="#fff7ed"/>
    <rect x="12" y="12" width="96" height="96" rx="24" fill="url(#bg)"/>
    <path d="M35 44h35c9.7 0 17.5 7.8 17.5 17.5S79.7 79 70 79H50" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 37v46M72 37l12 12-12 12" fill="none" stroke="#fff7ed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 主标题 -->
  <text
    x="100"
    y="420"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="80"
    font-weight="700"
    fill="#ffffff"
    letter-spacing="-0.02em"
  >
    Squoosh Web
  </text>

  <!-- 副标题 -->
  <text
    x="100"
    y="490"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="32"
    font-weight="400"
    fill="#ffffff"
    opacity="0.85"
    letter-spacing="0.01em"
  >
    Browser-local Image Compression — JPEG / WebP / AVIF / PNG
  </text>

  <!-- 底部标签 -->
  <g transform="translate(100, 540)">
    <rect width="200" height="40" rx="20" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
    <text
      x="100"
      y="26"
      text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="14"
      font-weight="500"
      fill="#ffffff"
      opacity="0.9"
    >
      Cloudflare Pages + WASM
    </text>
  </g>

  <!-- 右下角图标 -->
  <g transform="translate(1040, 490)" opacity="0.9">
    <rect width="80" height="80" rx="20" fill="#fff7ed"/>
    <rect x="8" y="8" width="64" height="64" rx="16" fill="url(#bg)"/>
    <path d="M23 30h20c5.5 0 10 4.5 10 10s-4.5 10-10 10H35" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 25v18M45 25l5 5-5 5" fill="none" stroke="#fff7ed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
